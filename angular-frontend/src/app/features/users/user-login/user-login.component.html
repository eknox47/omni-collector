<form [formGroup]="loginForm" (ngSubmit)="submit()">
	<div class="login-heading">
		<span class="eyebrow">BAT-COLLECTOR</span>
		<h1>Welcome back</h1>
		<p>Sign in to continue to your library.</p>
	</div>

	<label>
		Email
		<input placeholder="bruce.wayne@wayne.com" class="form-control" type="email" formControlName="email" autocomplete="email">
		@if (loginForm.controls['email'].touched && loginForm.controls['email'].invalid) {
			<span class="field-error">Enter a valid email address.</span>
		}
	</label>

	<label>
		Password
		<input placeholder="********" class="form-control" type="password" formControlName="password" autocomplete="current-password">
		@if (loginForm.controls['password'].touched && loginForm.controls['password'].invalid) {
			<span class="field-error">Password is required.</span>
		}
	</label>

	<button class="btn btn-primary" type="submit">Log in</button>

	<p class="signup">
		Don't have an account?
		<a href="users/create">Sign up</a>
	</p>
		
	@if (errorMessage()) {
		<div class="alert alert-danger mt-3" role="alert">
			{{ errorMessage() }}
		</div>
	}
</form>
